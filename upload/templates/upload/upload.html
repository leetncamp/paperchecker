<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Paper Checker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
</head>
<body style="padding:20px;">
<h1>Paper Checker</h1>
<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    {{ uploadForm.non_field_errors }}
    <table>
        {% for field in uploadForm %}
            <tr>
                <td>
                    {% if 'confirm' in field.label %}
                        <td>{{ field.as_widget }} &nbsp;{{ field.errors }}</td>
                        <td> &nbsp;{{ field.label_tag }}</td>
                    {% else %}
                        <td>{{ field.label_tag }} &nbsp;{{ field.errors }}</td>
                        <td>{{ field }}</td>
                    {% endif %}
            </tr>
        {% endfor %}
    </table>
    <button class="btn btn-primary my-3" type="submit">Upload</button>
</body>
</html>
